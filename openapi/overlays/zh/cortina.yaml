      - Unique Identifier for the vending machine printed on a
      sticker or encoded in the QR (HW-Serial of the device)
  - target: $.components.schemas.StaticNotifyRequest.properties.TransactionId.description
    update: |
      - Mandatory
      - Length: 40
      - Unique identifier for the transaction which will be echoed
      in further requests and responses. Minimum of 8 chars.
  - target: $.components.schemas.StaticNotifyRequest.properties.UniQR.description
    update: |
      - Conditional, must be sent if TerminalId is not sent.
      - Machine reference unique qr number
  - target: $.components.schemas.StaticRefundRequest.properties.ReasonCode.description
    update: |
      - Optional
      - Refund reason code (by nayax system table of error codes)
  - target: $.components.schemas.StaticRefundRequest.properties.ReasonText.description
    update: |
