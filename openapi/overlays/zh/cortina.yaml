      Revalue credit amount.
      - Only if card is configured a revalue-able
  - target: $.components.schemas.BasicInfo.description
    update: Basic transaction information.
  - target: $.components.schemas.BasicInfo.properties.AgeLimitation.description
    update: |
      Minimum age required for transaction approval.
  - target: $.components.schemas.BasicInfo.properties.Amount.description
    update: |
      Transaction amount. Use decimal format (e.g. 0.01 for 1 cent). Currencies without decimal places should also be expressed as a double (e.g. 234.0).
  - target: $.components.schemas.BasicInfo.properties.AuditNumber.description
    update: |
      For internal Nayax use.
  - target: $.components.schemas.BasicInfo.properties.BillingProviderId.description
    update: |
      ID of the billing provider (assigned by Nayax).
  - target: $.components.schemas.BasicInfo.properties.CurrencyCode.description
    update: |
      ISO 4217 currency code in Alpha-3 format (e.g. USD, EUR, ILS).
  - target: $.components.schemas.BasicInfo.properties.CurrencyNumeric.description
    update: |
      ISO 4217 currency code in Numeric-3 format.
  - target: $.components.schemas.BasicInfo.properties.IsDeferredAuthorization.description
    update: |
      Indicates whether the authorization is deferred.
  - target: $.components.schemas.BasicInfo.properties.IsProductSelected.description
    update: |
      Indicates whether a product was pre-selected before payment.
  - target: $.components.schemas.BasicInfo.properties.IsSoftDeclineCompletion.description
    update: |
      Indicates whether the transaction was completed after a soft decline.
  - target: $.components.schemas.BasicInfo.properties.MachineAuTime.description
    update: |
      Timestamp of machine authorization (DDMMYYHHMMSS).
  - target: $.components.schemas.BasicInfo.properties.NayaxRRN.description
    update: |
      Reference number for external identification. Should be visible to the end-user or external parties (e.g. card issuer, app provider). Echoed in `/Inquiry` requests.
  - target: $.components.schemas.BasicInfo.properties.NayaxTransactionId.description
    update: |
      Internal Nayax ID used to track the transaction in future requests.
  - target: $.components.schemas.BasicInfo.properties.PaymentMethodID.description
    update: |
      ID of the payment method provider (assigned by Nayax).
  - target: $.components.schemas.BasicInfo.properties.SiteId.description
    update: |
      Region identifier for the Nayax server.
  - target: $.components.schemas.BasicInfo.properties.TimeoutMS.description
    update: |
      Server timeout in milliseconds.
  - target: $.components.schemas.BasicInfo.properties.TransactionId.description
    update: |
      Unique identifier for the transaction.
      - If `/StartSession` was used, this echoes the encrypted transaction ID (`TranIDCipher`).
      - If not, the Nayax engine generates this value.
  - target: $.components.schemas.Batch.properties.AddToBatch.description
    update: |
      Denote on whether to add to the batch
  - target: $.components.schemas.Batch.properties.BatchId.description
    update: |
      Batch id relevant to the transaction
  - target: $.components.schemas.Batch.properties.BatchTransactionId.description
    update: |
      The transaction id inside the batch (id)
  - target: $.components.schemas.Batch.properties.DeleteFromBatch.description
    update: |
      Denote on whether to delete from batch
  - target: $.components.schemas.BatchOperation.description
    update: |
      * 1 - Open
      * 3 - Close
  - target: $.components.schemas.BatchStatus.description
    update: |
      *  0 - Missing
      *  1 - Open
      *  2 - InProgress
      *  3 - Close
      *  4 - Reopen
      *  5 - Closed
      *  6 - Declined
      * 99 - Unknown
  - target: $.components.schemas.CardBrandInfo.properties.PrimaryDescription.description
    update: Primary Brand Description
  - target: $.components.schemas.CardBrandInfo.properties.PrimaryId.description
    update: Primary Brand Id
  - target: $.components.schemas.CardBrandInfo.properties.SecondaryDescription.description
    update: Secondary Brand Description
  - target: $.components.schemas.CardBrandInfo.properties.SecondaryId.description
    update: Secondary Brand Id
  - target: $.components.schemas.CardData.description
    update: Additional data we read from the card (EMV data, expiration date, cvv2, etc.)
  - target: $.components.schemas.CardData.properties.CVV2.description
    update: |
      Optional, cvv2
  - target: $.components.schemas.CardData.properties.CardHolderName.description
    update: Card Holder Name
  - target: $.components.schemas.CardData.properties.CardNumber.description
    update: |
      - String ()
      - Mandatory
      - For card present Authorization and Sale, the full Track2 will be sent in this field.
      - For card not present, Settlement, Cancel, Void, Refund - The card PAN only will be sent.
  - target: $.components.schemas.CardData.properties.EMVData.description
    update: |
      String of emv tags in TLV format
  - target: $.components.schemas.CardData.properties.EntryMode.description
    update: |
      String (4)
      Mandatory
      Optional Value:
      * MCR - Card number read from the card magnetic stripe.
      * CON - Card details read from the chip via the contact interface (insert).
      * CLS - Card details read from the chip via the contactless interface (tap).
      * NFC - Card details read from the phone via the contactless interface (phone tap).
      * CLM - Card track2 read from the chip via the contactless interface (contactless magstripe\\legacy mode).
      * MIF\\MIFH - MIFARE\\MIFARE received as Hexadecimal
      * QR - Card number read from a QR by the [DOT](https://www.nayax.com/solution/dot/)

      Other values may also be sent in specific edge case, for more information please consult your Nayax POC.
  - target: $.components.schemas.CardData.properties.ExpMonth.description
    update: Conditional only when Interface is 1 or 10, (MM)
  - target: $.components.schemas.CardData.properties.ExpYear.description
    update: Conditional only when Interface is 1 or 10, (YY)
  - target: $.components.schemas.CardData.properties.IDNumber.description
    update: ID Number
  - target: $.components.schemas.CardData.properties.IsDebitCard.description
    update: Indication if card is Debit or Prepaid
  - target: $.components.schemas.CountryInfo.description
    update: |
      Actor and Machine Country information
  - target: $.components.schemas.CountryInfo.properties.Alpha2Code.description
