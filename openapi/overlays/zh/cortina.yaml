  - target: $.components.schemas.DukptInfo.description
    update: Contains encryption details using the DUKPT (Derived Unique Key Per Transaction) method.
  - target: $.components.schemas.DukptInfo.properties.Algorithm.description
    update: |
      Encryption algorithm used:
      - `1` = TDEA
      - `2` = 2TDEA
      - `3` = AES-128
      - `4` = AES-256
      - `5` = 3TDEA
  - target: $.components.schemas.DukptInfo.properties.ExternalKeyId.description
    update: External key identifier.
  - target: $.components.schemas.DukptInfo.properties.KSN.description
    update: Key serial number used for DUKPT encryption.
  - target: $.components.schemas.DukptInfo.properties.PINBlock.description
    update: |
      Encrypted PIN data provided by the cardholder. Encrypted using the key received from the TMS.
  - target: $.components.schemas.DukptInfo.properties.PINBlockFormat.description
    update: |
      * 1 - ISO 0
      * 5 - ISO 1
      * 34 - ISO 2
      * 47 - ISO 3
      * 48 - ISO 4
  - target: $.components.schemas.DynamicInquiryRequest.properties.Polling.description
    update: Optional Polling Information
  - target: $.components.schemas.DynamicInquiryRequest.properties.Products.items.description
    update: Mandatory Products details
  - target: $.components.schemas.DynamicInquiryResponse.properties.Status.description
    update: |
      Use 993 to keep polling.
      See status description for more info
  - target: $.components.schemas.DynamicQrRequest.properties.ChannelId.description
    update: |
      - Conditional, for Multi-channel integration, Contact Nayax TPOC to define.
      - Channel Values shall be provided by Nayax, and cannot be altered.
  - target: $.components.schemas.DynamicQrResponse.properties.QRCode.description
    update: |
      - Mandatory
      - QR URL for device
  - target: $.components.schemas.DynamicRefundRequest.properties.ReasonCode.description
    update: |
      - Optional
      - length: Short integer (16)
      - Refund reason code as saved in Nayax system
  - target: $.components.schemas.DynamicRefundRequest.properties.ReasonText.description
    update: |
      - Optional
      - length: 64
      - Refund description as saved in Nayax system
  - target: $.components.schemas.DynamicVoidRequest.properties.ReasonCode.description
    update: |
      - Optional
      - length: Short integer (16)
      - Refund reason code as saved in Nayax system
  - target: $.components.schemas.DynamicVoidRequest.properties.ReasonText.description
    update: |
      - Optional
      - length: 64
      - Refund description as saved in Nayax system
  - target: $.components.schemas.ECIType.description
    update: |
      Electronic Commerce Indicator (ECI), used to identify the type of transaction authentication performed.
      Only applicable when `interface = 01`.
      Possible values: - `1` – Mail Order/Telephone Order (MOTO), no 3DS - `5` – Fully authenticated CAVV/UCAFF verification - `6` – Attempted authentication at a 3DS-capable merchant (proof of attempt) - `7` – Non-authenticated e-commerce transaction
  - target: $.components.schemas.ECom3DSInfo.description
    update: |
      Contains 3-D Secure (3DS) data used for Strong Customer Authentication (SCA) in electronic commerce transactions.
  - target: $.components.schemas.ECom3DSInfo.properties.ECom3DSAdditionalData.description
    update: Additional 3DS-specific data in string format.
  - target: $.components.schemas.ECom3DSInfo.properties.ECom3DSCallbackUrl.description
    update: URL for receiving the callback from the acquirer.
  - target: $.components.schemas.ECom3DSInfo.properties.ECom3DSRequested.description
    update: Indicates whether SCA verification is requested for this transaction.
  - target: $.components.schemas.ECom3DSInfo.properties.ECom3DSUCAFFCAVV.description
    update: |
      Base64-encoded authentication value (CAVV/UCAFF). Required only if `ECI = 05`.
  - target: $.components.schemas.ECom3DSInfo.properties.ECom3DSVersion.description
    update: |
      Specifies the supported 3DS version. Typically set to `1`.
  - target: $.components.schemas.ECom3DSInfo.properties.XID.description
    update: Base64-encoded transaction ID used in 3DS authentication.
  - target: $.components.schemas.ECom3DSResponseInfo.properties.ECom3DSRedirectUrl.description
    update: where the requester should redirect the customer for the SCA verification
  - target: $.components.schemas.ECom3DSResponseInfo.properties.ECom3DSStatus.description
    update: |
      Conditional - when ECom3DSRequested was true.
        * 0/null/missing - no 3DS attempted
        * 1 - 3DS attempted & No SCA Required (Frictionless or waived by the issuer)
        * 2 - 3DS attempted - SCA Required (Redirect URL must be used)
        * 3 - 3DS attempt could not be completed with provider
        * 4 - SCA performed and Failed
        * 5 - SCA performed and Completed
        * 6 - SCA could not be completed by Issuer
  - target: $.components.schemas.ECom3DSType.description
    update: |
      3DS version supported by the merchant:
      * 0 - Not supported
      * 1 - 3DS version 1.0
      * 2 - 3DS version  2.0
  - target: $.components.schemas.EMVTags.description
    update: Response EMV tags, Mandatory for Contact.
  - target: $.components.schemas.EMVTags.properties.Tag71.description
    update: EMV Tag 71 (Issuer Script Template 1). Tags 71 and 72 are optional and in any case should only be sent on Contact flow.
  - target: $.components.schemas.EMVTags.properties.Tag72.description
    update: EMV Tag 72 (Issuer Script Template 2). Tags 71 and 72 are optional and in any case should only be sent on Contact flow.
  - target: $.components.schemas.EMVTags.properties.Tag8A.description
    update: EMV Tag 8A (Authorisation Response Code), Mandatory for Contact. Value must be sent in ASCII value, e.g.value of 00 (HEXA) should be sent as 3030 (ASCII) and value of 05 (HEXA) should be sent as 3035 .
  - target: $.components.schemas.EMVTags.properties.Tag91.description
    update: EMV Tag 91 (Issuer Authentication Data), Mandatory for Contact.
  - target: $.components.schemas.EncryptInfo.description
