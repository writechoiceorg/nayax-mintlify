  - target: $.components.schemas.DenyListIndication.description
    update: |
      * 0 - unknown/ no effect
      * 1 - Decline will cause consumer to be added to the deny list
      * 2 - Approval shall cause the consumer to be removed from deny list.
  - target: $.components.schemas.DeviceInfo.description
    update: Hardware and firmware information of the Nayax device.
  - target: $.components.schemas.DeviceInfo.properties.FWVersion.description
