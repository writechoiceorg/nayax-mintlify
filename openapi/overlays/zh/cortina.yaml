  - target: $.components.schemas.PaymentInfo.description
    update: |
      Identifies transaction information and references. Included in all response messages for payment calls.
      When used in requests (e.g. `/Settlement`, `/Void`, `/Refund`, `/Inquiry`), this object should match the `PaymentInfo` returned in a previous call.
  - target: $.components.schemas.PaymentInfo.properties.SrvTranId.description
    update: |
      Integrator's internal transaction ID. Use only if `/StartSession` was not used. If `/StartSession` was used, this should be empty or echo the transaction ID from the request.
  - target: $.components.schemas.PaymentInfo.properties.AuthCode.description
    update: |
      External authorization code (usually from the card issuer). In dynamic QR, the approval code from the `/Inquiry` response overrides previous values.
  - target: $.components.schemas.PaymentInfo.properties.AuthAmount.description
    update: |
      Original amount requested in `/Authorization` or `/Sale`. Optional in other cases.
  - target: $.components.schemas.PaymentInfo.properties.SettAmount.description
    update: |
      Final settled amount, used in `/Settlement`, `/Inquiry`, or `/Sale`. In Cortina External Prepaid, this may reflect a discounted amount and is used for reporting only.
  - target: $.components.schemas.PaymentInfo.properties.RRN.description
    update: |
      Reference Retrieval Number. Should be visible to the cardholder and match the one in the `/GenerateQR` response.
  - target: $.components.schemas.PaymentInfo.properties.Token.description
    update: |
      Unique token for the transaction. For internal Nayax use only.
  - target: $.components.schemas.PaymentInfo.properties.AuthDateTime.description
    update: |
      Date and time of the `/Authorization` or `/Sale`. Format: `ddMMyyHHmmss`
  - target: $.components.schemas.PaymentInfo.properties.SettDateTime.description
    update: |
      Date and time of the `/Settlement` or `/Sale`. Format: `ddMMyyHHmmss`
  - target: $.components.schemas.PaymentInfo.properties.TraceNumber.description
    update: |
      Trace number. For internal Nayax use only.
  - target: $.components.schemas.PaymentInfo.properties.AdditionalData.description
    update: |
      Optional custom data in JSON format. Contact Nayax to configure.
  - target: $.components.schemas.PaymentInfo.properties.IsGatewayTimeout.description
    update: |
      Indicates whether there was a gateway timeout.
  - target: $.components.schemas.PaymentInfo.properties.ProviderExternalData.description
    update: |
      External data from provider in JSON format.
  - target: $.components.schemas.PaymentInfo.properties.InitiateTranReference.description
    update: |
      References the original Nayax transaction ID when reattempting a prepaid loyalty card transaction.
  - target: $.components.schemas.PaymentInfo.properties.IsRevalueCard.description
    update: |
      Indicates whether the card supports revalue.
  - target: $.components.schemas.Polling.properties.IsLastPolling.description
    update: |
      Flag indicator of last polling attempt
  - target: $.components.schemas.Polling.properties.PollingAttemptCounter.description
    update: |
