      Optional URL configuration at the actor level. Supports dynamic URLs. 
      - Max length: 255.
  - target: $.components.schemas.ActorInfo.properties.Id.description
    update: |
      Unique ID of the actor (merchant) as defined in the Nayax backoffice.
  - target: $.components.schemas.ActorInfo.properties.MCC.description
    update: |
      Merchant Category Code (MCC), classifies businesses by type of goods or services provided.
  - target: $.components.schemas.ActorInfo.properties.MerchantId.description
