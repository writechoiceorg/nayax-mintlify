<svg viewBox="0 0 440 158" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">App to App architecture</title>
  <desc id="desc">Three stacked layers: 3rd Party Application on top, Nayax VPOS Services in the middle, VPOS Media Operating System at the base.</desc>
  <rect x="20" y="12" width="400" height="42" rx="5" fill="#2E2E2E"/>
  <text x="220" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">3rd Party Application</text>
  <rect x="20" y="60" width="400" height="42" rx="5" fill="#FFC72C"/>
  <text x="220" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">Nayax VPOS Services</text>
  <rect x="20" y="108" width="400" height="42" rx="5" fill="#ECECEC" stroke="#d0d0d0" stroke-width="1"/>
  <text x="220" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">VPOS Media Operating System</text>
</svg>
